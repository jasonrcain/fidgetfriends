; --- OPcache: PROD ---
opcache.enable=1
opcache.enable_cli=0

; Right-size first; raise only if cache fills up
opcache.memory_consumption=192
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=100000

; PROD: turn OFF timestamp validation (deploy = reload FPM)
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Optional file cache survives FPM reloads
opcache.file_cache=/tmp/php-opcache
opcache.file_cache_only=0
opcache.file_cache_consistency_checks=1

opcache.save_comments=1
opcache.fast_shutdown=1

; Keep JIT off for typical Laravel workloads
opcache.jit=0
opcache.jit_buffer_size=0

; Realpath cache helps a lot for Composer-heavy apps
realpath_cache_size=4096k
realpath_cache_ttl=600
