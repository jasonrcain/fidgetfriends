[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

; ---------- Production, low-RAM friendly ----------
pm = ondemand
pm.max_children = 1000
pm.process_idle_timeout = 10s
pm.max_requests = 2000

; Health + diagnostics
pm.status_path = /fpm-status
ping.path = /ping
ping.response = pong

; Slow request logging
request_slowlog_timeout = 2s
slowlog = /usr/local/var/log/php-fpm-slow.log

; Terminate truly stuck requests
request_terminate_timeout = 60s

; Pass env for Laravel, Composer, etc.
clear_env = no

; Better TCP reuse
listen.backlog = 1024
