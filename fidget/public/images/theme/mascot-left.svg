<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Purple gear-ish mascot (placeholder) -->
  <g filter="url(#sh)">
    <!-- teeth -->
    <g fill="#A377FF" stroke="#5B2FD6" stroke-width="10" stroke-linejoin="round">
      <rect x="185" y="12" width="50" height="70" rx="18"/>
      <rect x="185" y="338" width="50" height="70" rx="18"/>
      <rect x="12" y="185" width="70" height="50" rx="18"/>
      <rect x="338" y="185" width="70" height="50" rx="18"/>
      <rect x="65" y="65" width="60" height="60" rx="18" transform="rotate(45 95 95)"/>
      <rect x="295" y="65" width="60" height="60" rx="18" transform="rotate(45 325 95)"/>
      <rect x="65" y="295" width="60" height="60" rx="18" transform="rotate(45 95 325)"/>
      <rect x="295" y="295" width="60" height="60" rx="18" transform="rotate(45 325 325)"/>
      <!-- body -->
      <circle cx="210" cy="210" r="150" fill="#B58CFF" />
    </g>

    <!-- face -->
    <circle cx="165" cy="205" r="20" fill="#0E2233"/>
    <circle cx="255" cy="205" r="20" fill="#0E2233"/>
    <circle cx="160" cy="198" r="7" fill="#fff"/>
    <circle cx="250" cy="198" r="7" fill="#fff"/>
    <path d="M160 255 C190 285 230 285 260 255" fill="none" stroke="#0E2233" stroke-width="14" stroke-linecap="round"/>
    <!-- blush -->
    <circle cx="135" cy="240" r="18" fill="#FF78C4" opacity="0.55"/>
    <circle cx="285" cy="240" r="18" fill="#FF78C4" opacity="0.55"/>

    <!-- arms -->
    <path d="M90 250 C40 240 35 200 60 175" fill="none" stroke="#5B2FD6" stroke-width="20" stroke-linecap="round"/>
    <path d="M330 250 C380 235 385 195 360 170" fill="none" stroke="#5B2FD6" stroke-width="20" stroke-linecap="round"/>
  </g>
</svg>
