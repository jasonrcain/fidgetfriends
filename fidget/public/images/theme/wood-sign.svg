<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="wood" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#D39B5F"/>
      <stop offset="1" stop-color="#B7773A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="rgba(255,255,255,0)"/>
      <stop offset="0.5" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Wood sign background (placeholder) -->
  <g filter="url(#shadow)">
    <rect x="30" y="30" width="1140" height="200" rx="52" fill="url(#wood)" stroke="#8A5528" stroke-width="10"/>
    <!-- wood stripes -->
    <g opacity="0.28" stroke="#8A5528" stroke-width="6">
      <path d="M70 90 H1130"/>
      <path d="M70 135 H1130"/>
      <path d="M70 180 H1130"/>
    </g>
    <!-- subtle shine -->
    <rect x="60" y="60" width="1080" height="140" rx="45" fill="url(#shine)" opacity="0.7"/>
    <!-- corner stars -->
    <g fill="#FFD34A" stroke="#C79A23" stroke-width="6">
      <path d="M95 130 l22 7 7 22 7-22 22-7-22-7-7-22-7 22z"/>
      <path d="M1105 130 l22 7 7 22 7-22 22-7-22-7-7-22-7 22z"/>
    </g>
  </g>
</svg>
