services:
  nginx:
    build:
      dockerfile: Dockerfile
      context: ./nginx
    ports:
      - "80:80"
    depends_on:
      - fidget-service
    networks:
      - public-net
      - services-net

  services-nginx:
    image: nginx:alpine
    expose:
      - "8080"
    volumes:
      - ./nginx/services-internal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
    depends_on:
      - fidget-service
    networks:
      - services-net

  fidget-service:
    build:
      dockerfile: Dockerfile.local
      context: ./fidget
    ports:
      - "8081:8081"
      - "8000:8000"
    volumes:
      - ./fidget:/var/www:cached
    networks:
      - services-net

networks:
  public-net:
    driver: bridge
  services-net:
    driver: bridge
