# nginx/services-internal.conf
# Mounted into the "services-nginx" container as /etc/nginx/conf.d/default.conf
# Only attached to services-net. No host ports published.

server {
    listen 8080 default_server;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=30s;

    client_max_body_size 20m;
    keepalive_timeout 65;

    # Health
    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # No index here; if someone curls / by accident, be explicit
    location = / {
        return 404;
    }

    # ---------- INTERNAL ROUTES ----------
    # Strip prefix and forward to Laravel via PHP-FPM
    location /fidget/ {
        rewrite ^/fidget/?(.*)$ /$1 break;

        include /etc/nginx/includes/php_fastcgi.conf;
        fastcgi_param REQUEST_URI $request_uri;

        set $fidget_fpm fidget-service:9000;
        fastcgi_pass $fidget_fpm;
    }

    # Safety: default to 404 for unknown prefixes
    location / {
        return 404;
    }
}
